name: CI / Automated Build & Security Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite with PYTHONPATH
        env:
          ENVIRONMENT: "test"
          SECRET_KEY: "test-environment-cryptographically-random-key-for-ci"
          WORKER_SECRET: "test-environment-worker-secret-internal-ci-only"
        run: |
          cd backend
          python -m pytest app/tests -v

  frontend-build:
    name: Frontend Linter & Next.js Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build

